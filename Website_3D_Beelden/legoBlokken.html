<!DOCTYPE html>
<html lang="en">

<head>
  <title>Random Blocks to a Head.</title>
  <meta charset="utf-8">
  <!-- 
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		-->
  <meta name="author" content=" Rob van Cooten. Waalre. ">
  <!--   http://localhost/www/hccnet/Website_3D_Beelden/legoBlokken.html   -->
  <meta name="keywords" content="3D models, Threejs, Ceramics">
  <meta name="description" content="Showing all kinds of ways to show ceramics heads using ThreeJS.">
  <link type="text/css" rel="stylesheet" href="css/main.css">
  <link href="css/menu.css" rel="stylesheet" type="text/css">
  <link rel="shortcut icon" href="./images/ernie.ico">
  <style>
    body {
      cursor: url(./images/biglips.cur), auto;
      touch-action: none;
    }

    #toon {
      position: absolute;
      right: 15%;
      top: 85%;
      height: 5vw;
      width: 10vw;
      text-align: center;
      border-radius: 50%;
      background-color: lightgreen;
      color: darkgreen;
      border: 5px solid darkgreen;
      text-transform: lowercase;
      z-index: +10;
    }

    .unselectable {
      /* speciaal voor touch devices */
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      /* Safari */
      -webkit-user-select: none;
      /* Chrome */
      -moz-user-select: none;
      /* Firefox */
      -ms-user-select: none;
      /* Internet Explorer/Edge */
    }
  </style>
</head>

<body>
  <div id="menu">

  </div>
  <button type="button" id="toon" class="unselectable"> Translate.</button>

  <script type="importmap">
			{
				"imports": {
					"three": "./build/three.module.js" ,
				"three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.3/build/index.module.js",          
					"three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.16/build/index.module.js"           

				}
			}
		</script>

  <script type="module">
    import { leesMenuTekst, isTouchDevice, kleurActiveLink } from './my_js/menu_tekst.js';
    import * as THREE from 'three';
    import { GLTFLoader } from './jsm/loaders/GLTFLoader.js';
    import {
      Brush,
      Evaluator,
      INTERSECTION,
    } from 'three-bvh-csg';

    import { OrbitControls } from './jsm/controls/OrbitControls.js';
    import { FontLoader } from './jsm/loaders/FontLoader.js';
    import { TextGeometry } from './jsm/geometries/TextGeometry.js';

    let container;
    let camera, scene, renderer;
    let kop;
    let groepDuo;
    const pieces = [];
    let cellYCenter;
    let aantalCubes = 0; // aantalCubes
    const vertex = new THREE.Vector3();
    const vertices = []; const verticesR = [];

    let controls;
    let mess = "Waiting \n for \n Lego \n blocks \n .............";
    let textMesh = null;
    let k = 0; let n = 0;
    let richting = 0;
    let rot = 1; let ringNummer = 1; let nummer = 0;

    init();

    function init() {
      maakMenu();
      maakScene();
      maakBelichting();
      maakTekst(mess);

      laadModelAsync();

      myRenderer();
      window.addEventListener('resize', onWindowResize);
      let toon = document.getElementById('toon');
      toon.addEventListener("pointerdown", pointerDown, false);
      
      animate();
      startOrbitController();
    }   // einde init

    function maakMenu() {
      let menu;

      menu = document.getElementById("menu");
      if (isTouchDevice())
        menu.innerHTML = leesMenuTekst() + "Use fingers to rotate, zoom. Touch to stop.";
      else
        menu.innerHTML = leesMenuTekst() + "Use mouse to rotate, start/stop. Wheel to zoom. Or arrow keys 2move. ";

      kleurActiveLink();

      //	container = document.createElement('div');
      //	document.body.appendChild(container);
    }

    function myRenderer() {
      //	renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer = new THREE.WebGLRenderer({ alpha: true }); // transparant.  
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      document.body.appendChild(renderer.domElement);
      //  container.appendChild(renderer.domElement);      			
    }

    function render() {
      if (groepDuo != null)
        groepDuo.rotation.y += 0.02 * richting;
      //   console.log("Richting: " + richting); 
      if (richting == 0)
        toonKop();
      else if (richting == 1)
        translateToNormal();
      else if (richting == 2)
        toonRandomKop(cellYCenter);
      else if (richting == 3)
        translateToRandom();
      else
        console.log("Foutje, doe niks");

      renderer.render(scene, camera);

    }  // end render(); 

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      render();
    }

    function maakBelichting() {
      let ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 8.2); // 20 te veel licht, geen kleur meer.
      directionalLight.position.set(1, 1, 1);
      directionalLight.target.position.set(0, 0, 0);
      scene.add(directionalLight);
      const directionalLight2 = new THREE.DirectionalLight(0xffffff, 8.2); // 20 te veel licht, geen kleur meer.
      directionalLight2.position.set(-1, 1, 1);
      directionalLight2.target.position.set(0, 0, 0);
      scene.add(directionalLight2);
    }


    async function laadModelAsync() {
      const loader = new GLTFLoader();
      let pad = "https://cdn.jsdelivr.net/gh/robvancooten/glb/";
      let model = pad + 'bladerKop.glb';

      const gltf = await loader.loadAsync(model);

      kop = gltf.scene;
      kop = gltf.scene.children[0];
      kop.scale.multiplyScalar(1);  // 50 
      kop.rotation.z = 0.5;  //  *Math(PI); 
      //  scene.add(kop)

      splitsKop();
      toonDuoKoppen();

    }

    function toonDuoKoppen() {
      const s = 0.5;
      kop.scale.set(s, s, s);

      let clone = kop.clone();
      clone.rotation.z = Math.PI;  // let op rotatie clone vreemd.

      //  clone.position.z = -1;

      groepDuo = new THREE.Group();
      groepDuo.add(clone);
      groepDuo.add(kop);
      groepDuo.position.y = -20;
      //   scene.add(kop);
      scene.add(groepDuo);

    }

    function splitsKop() {
      const mesh = kop.getObjectByProperty("isMesh", true);

      if (!mesh) throw new Error("No mesh found")

      mesh.updateWorldMatrix(true, false);

      // Put source geometry in world coordinates so the boxes use the same space.
      const sourceGeometry = mesh.geometry.clone();
      sourceGeometry.applyMatrix4(mesh.matrixWorld);

      const sourceBrush = new Brush(sourceGeometry, mesh.material);
      sourceBrush.updateMatrixWorld(true);



      const bounds = new THREE.Box3().setFromObject(mesh);
      console.log("bounds.max.x: " + bounds.max.x.toFixed(2));
      console.log("bounds.min.x: " + bounds.min.x.toFixed(2));

      const evaluator = new Evaluator();

      let deltaX = -1; let deltaY = -1; let deltaZ = -1;
      const cellSize = 2;
      let cellX = -1; let cellY = -1; let cellZ = -1;

      cellYCenter = (bounds.max.y - bounds.min.y) / (2 * cellSize);
      cellYCenter = Math.floor(cellYCenter);

      let shift = 0.1;   // 2,  boxes iets gescheiden tonen. 
      /*****    x      ****/
      for (let x = bounds.min.x; x < bounds.max.x; x += cellSize) {
        cellX++;
        cellY = cellZ = -1;
        //  console.log("cellX " + cellX);
        deltaY = deltaZ = 0;
        deltaX = deltaX + shift;
        /*****    y      ****/
        for (let y = bounds.min.y; y < bounds.max.y; y += cellSize) {
          cellY++;
          cellZ = -1;
          deltaZ = -1;
          deltaY = deltaY + shift;
          /*****    z      ****/
          for (let z = bounds.min.z; z < bounds.max.z; z += cellSize) {
            cellZ++;
            let box = new THREE.Mesh(
              new THREE.BoxGeometry(cellSize, cellSize, cellSize),
              new THREE.MeshBasicMaterial()
            );

            box.position.set(x + cellSize / 2 + deltaX, y + cellSize / 2 + deltaY, z + cellSize / 2 + deltaZ);
            box.updateMatrixWorld(true);

            vertex.copy(box.position);
            //  vertices.push(vertex);  // vreemd verticesR werkt dan niet....
            vertices.push(box.position);

            const boxBrush = new Brush(box.geometry);
            boxBrush.position.copy(box.position);
            boxBrush.updateMatrixWorld(true);

            const result = evaluator.evaluate(sourceBrush, boxBrush, INTERSECTION);

            if (result.geometry.getAttribute("position").count > 0) {
              const piece = new THREE.Mesh(result.geometry, mesh.material);


              // pieces.push(box.clone());

              // console.log("cellY: " + cellY);

              if (cellY < 8) {
                if ((cellY == 6 && cellX > 1) || (cellY != 6))  // in cellY==6 zitten twee corrupte cellen.                 
                  pieces.push(piece.clone());
              }

              toonKop();
              toonRandomKop(cellYCenter);
              maakTekst("Lego blocks....");

              aantalCubes++;
            }

            box.geometry.dispose();
            box.material.dispose();
          }  // end for x
        }   // end for y
        //  console.log(">> aantal boxes in y vlak: " + aantalCubes);
      }   // end for z
      console.log("\n >> aantal boxes: " + aantalCubes + "\n");
      //  console.log(">> cellYCenter: " + cellYCenter);

    };   // end splitsKop; 

    function toonKop() {
      let shift = 0;
      for (let k = 0; k < pieces.length; k++) {
        scene.add(pieces[k]);
        pieces[k].position.set(vertices[k].x, vertices[k].y + shift * 10, vertices[k].z);
        //   pieces[k].position.y += -25;
        //  console.log("k: " + k + "  pieces[k].position.y: " + pieces[k].position.y);
      }
    }

    function toonRandomKop(cellYCenter) {
      //   let cellYCenter = cC ; 
      let shift = 0;
      let randomHoogte;

      for (let k = 0; k < pieces.length; k++) {
        randomHoogte = Math.floor(Math.random() * cellYCenter);
        scene.add(pieces[k]);
        pieces[k].position.set(randomHoogte, randomHoogte, randomHoogte);
        verticesR.push(pieces[k].position);
        // pieces[k].position.y += -25;
        //  console.log("k: " + k + "  pieces[k].position.y: " + pieces[k].position.y);
        //  console.log("verticesR" + verticesR[k].y);
      }
    }

    function translateToNormal() {
      let speed = 2;
      let verschil = 1000;

      pieces[nummer].position.x = pieces[nummer].position.x + (vertices[nummer].x - pieces[nummer].position.x) / speed;
      pieces[nummer].position.y = pieces[nummer].position.y + (vertices[nummer].y - pieces[nummer].position.y) / speed;
      pieces[nummer].position.z = pieces[nummer].position.z + (vertices[nummer].z - pieces[nummer].position.z) / speed;

      verschil = pieces[nummer].position.x - vertices[nummer].x;
      verschil = verschil.toFixed(2);

      if (verschil < 0.2 && verschil > -0.2) {
        pieces[nummer].position.x = pieces[nummer].position.x -10; 
        nummer++;
        //  if (nummer > aantalCubes - 1){
        if (nummer > pieces.length - 1) {
          nummer = 0;
        //  richting = 0;
          pointerDown();           
        }
        console.log("translateToNormal \n Nummer: " + nummer + "/" + aantalCubes + " verschil bijna nul: " + verschil);
      }

      //   console.log("pieces[nummer].position.x - vertices[nummer].x: \n" + pieces[nummer].position.x + " - " + vertices[nummer].x);
      //    console.log("nummer: " + nummer + "  verschil: " + verschil) ;

    }

    function translateToRandom() {
      let speed = 2;
      let verschil = 1000;

      // pieces[nummer].position.set(vertices[nummer].x, vertices[nummer].y, vertices[nummer].z);
      pieces[nummer].position.x = pieces[nummer].position.x + (verticesR[nummer].x - pieces[nummer].position.x) / speed;
      pieces[nummer].position.y = pieces[nummer].position.y + (verticesR[nummer].y - pieces[nummer].position.y) / speed;
      pieces[nummer].position.z = pieces[nummer].position.z + (verticesR[nummer].z - pieces[nummer].position.z) / speed;

      verschil = pieces[nummer].position.x - vertices[nummer].x;
      verschil = verschil.toFixed(2);

      if (verschil < 0.2 && verschil > -0.2) {
        pieces[nummer].position.x = pieces[nummer].position.x -10; 
        nummer++;

        if (nummer > (pieces.length - 1)) {
          nummer = 0;
        //  richting = 0;
          pointerDown(); 
        }
        console.log("translateToRandom \n Nummer: " + nummer + "/" + aantalCubes + "\t verschil bijna nul: " + verschil);
      }

      //   console.log("pieces[nummer].position.x - vertices[nummer].x: \n" + pieces[nummer].position.x + " - " + vertices[nummer].x);
      //    console.log("nummer: " + nummer + "  verschil: " + verschil) ;



    }

    function startOrbitController() {
      controls = new OrbitControls(camera, renderer.domElement);
      controls.addEventListener('change', render);
      controls.listenToKeyEvents(window);    // pijltjes toetsen.
      //	controls.enableDamping = true; // an animation loop is required when either damping or auto-rotation are enabled
      //		controls.dampingFactor = 0.05;

      controls.minPolarAngle = Math.PI * 0.35;     // tilt. , x as.
      controls.maxPolarAngle = Math.PI * 0.6;

      controls.minAzimuthAngle = -Math.PI * 100 * 0.25;      // rot y as.
      controls.maxAzimuthAngle = +Math.PI * 100 * 0.4;

      //controls.target.set(0, 10, 0);
      controls.minDistance = 20.0;
      controls.maxDistance = 400.0;

      //	controls.autoRotate = true;
      //	controls.autoRotateSpeed =2 ; 
    }

    function maakTekst(mess) {
      if (textMesh != null) {
        scene.remove(textMesh);
      }
      scene.remove(textMesh);

      const loader = new FontLoader();
      let font = undefined,
        fontName = 'gentilis', // helvetiker, optimer, gentilis, droid sans, droid serif
        fontWeight = 'normal'; // normal bold

      loader.load('./fonts/helvetiker_regular.typeface.json', function (font) {

        const textGeo = new TextGeometry(mess, {
          font: font,
          size: 4,
          height: 2.5,
          curveSegments: 12,
          bevelEnabled: false,   // true,
          bevelThickness: 1,  // 10
          bevelSize: 0.08,    // 8
          bevelOffset: 0,
          bevelSegments: 1  // 5
        });

        textGeo.computeBoundingBox();
        const centerOffset = - 0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);

        const materials = [
          new THREE.MeshPhongMaterial({ color: 0xaaaa00, flatShading: true }), // front
          new THREE.MeshPhongMaterial({ color: 0x555500 }) // side
        ];

        textMesh = new THREE.Mesh(textGeo, materials);
        textMesh.scale.z = 0.05;

        textMesh.position.x = centerOffset;
        textMesh.position.y = +30;
        // 	textMesh.rotation.y = Math.PI * 2;
        textMesh.rotation.y = Math.PI * 2;

        scene.add(textMesh);
      });
    }

    function maakScene() {
      container = document.createElement('div');
      document.body.appendChild(container);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
      camera.position.z = 100;

      // scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xaaaaaa);

      scene.add(camera);
    }

      function pointerDown() {
        if (richting == 0)
          richting = +1;
        else if (richting == +1)
          richting = +2;
        else if (richting == 2)
          richting = 3;
        else if (richting == 3)
          richting = 0;

        if (richting == +1) {
          toon.style.backgroundColor = "Green";
          toon.style.borderColor = "Yellow";
          toon.style.color = "yellow";
        }

        else if (richting == 3) {
          toon.style.backgroundColor = "blue";
          toon.style.borderColor = "CornflowerBlue";
          toon.style.color = "yellow";
        }
        else {
          toon.style.backgroundColor = "blue";
          toon.style.borderColor = "Yellow";
          toon.style.color = "yellow";
        }  

        toon.innerHTML = "<p> " + richting + " </p>";


      }   // einde pointerDown

  </script>

</body>
