<!DOCTYPE html>
<html lang="en">

<head>
	<title>three.js webgl - materials - dynamic cube reflection</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
<!--   https://threejs.org/examples/#webgl_materials_cubemap_dynamic  -->
	<link type="text/css" rel="stylesheet" href="main.css">
	<style>
		body {
			touch-action: none;
		}
	</style>
</head>

<body>

	<div id="info"><a href="https://threejs.org" target="_blank" rel="noopener">three.js webgl</a> - materials - dynamic
		cube reflection</div>

	<script type="importmap">
			{
				"imports": {
					"three": "./build/three.module.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

	<script type="module">

		import * as THREE from 'three';

		import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
		import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';

		import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
		import Stats from 'three/addons/libs/stats.module.js';
		import { GLTFLoader } from './jsm/loaders/GLTFLoader.js';

		let camera, scene, renderer, stats;
		let groep;
		let cube, sphere, torus, material;

		let cubeCamera, cubeRenderTarget;

		let controls;

		init();

		function init() {

			renderer = new THREE.WebGLRenderer({ antialias: true });
			renderer.setPixelRatio(window.devicePixelRatio);
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.setAnimationLoop(animate);
			renderer.toneMapping = THREE.ACESFilmicToneMapping;
			document.body.appendChild(renderer.domElement);

			window.addEventListener('resize', onWindowResized);

			stats = new Stats();
			document.body.appendChild(stats.dom);

			camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
			camera.position.z = 75;

			scene = new THREE.Scene();
			scene.rotation.y = 0.5; // avoid flying objects occluding the sun

			new HDRLoader()
				.setPath('textures/equirectangular/')
				.load('quarry_01_1k.hdr', function (texture) {

					texture.mapping = THREE.EquirectangularReflectionMapping;

					scene.background = texture;
					scene.environment = texture;

				});

			//


			cubeRenderTarget = new THREE.WebGLCubeRenderTarget(256);
			cubeRenderTarget.texture.type = THREE.HalfFloatType;

			cubeCamera = new THREE.CubeCamera(1, 1000, cubeRenderTarget);

			//

			material = new THREE.MeshStandardMaterial({
				envMap: cubeRenderTarget.texture,
				roughness: 0.05,
				metalness: 1
			});

			const gui = new GUI();
			gui.add(material, 'roughness', 0, 1);
			gui.add(material, 'metalness', 0, 1);
			gui.add(renderer, 'toneMappingExposure', 0, 2).name('exposure');

			sphere = new THREE.Mesh(new THREE.IcosahedronGeometry(15, 8), material);
			scene.add(sphere);

			const material2 = new THREE.MeshStandardMaterial({
				roughness: 0.1,
				metalness: 0
			});

			cube = new THREE.Mesh(new THREE.BoxGeometry(15, 15, 15), material2);
			scene.add(cube);

			torus = new THREE.Mesh(new THREE.TorusKnotGeometry(8, 3, 128, 16), material2);
			scene.add(torus);

			laadModelDuo();

			//

			controls = new OrbitControls(camera, renderer.domElement);
			controls.autoRotate = true;

		}

		function onWindowResized() {

			renderer.setSize(window.innerWidth, window.innerHeight);

			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();

		}

		function animate(msTime) {

			const time = msTime / 1000;

			cube.position.x = Math.cos(time) * 30;
			cube.position.y = Math.sin(time) * 30;
			cube.position.z = Math.sin(time) * 30;

			cube.rotation.x += 0.02;
			cube.rotation.y += 0.03;

			torus.position.x = Math.cos(time + 10) * 30;
			torus.position.y = Math.sin(time + 10) * 30;
			torus.position.z = Math.sin(time + 10) * 30;

			torus.rotation.x += 0.02;
			torus.rotation.y += 0.03;

			cubeCamera.update(renderer, scene);

			controls.update();

			renderer.render(scene, camera);

			stats.update();

		}

		function laadModelDuo() {
			let pad, kop, clone;
			// let x = location.hostname;
			if (location.hostname == "localhost") {
				pad = "./modellen/glb/"
				//   showCPU = true;
			}
			else
				pad = "https://cdn.jsdelivr.net/gh/robvancooten/glb/";

			const kopnaam = 'bladerKop';
			let model = pad + kopnaam + '.glb';
			// console.log("model: " + model) ;
			const loader = new GLTFLoader();

			loader.load(model, function (gltf) {
				//   const mirror = gltf.scene.getObjectByName( kopnaam );
				kop = gltf.scene.children[0];
				// kop.scale.x = kop.scale.x = kop.scale.z = 1;
				//   kop.rotation.x = 1.2 * Math.PI;  // werkt niet...


				
				kop.material = new THREE.MeshStandardMaterial({
					metalness: 1,
					roughness: 0,
				//    envMap: cubeRT.texture,
				//    side : THREE.DoubleSide
				});   


				//    scene.add(kop);

				clone = kop.clone();
				clone.scale.x = 1;
				clone.rotation.z = Math.PI;

				//    clone.position.z = 0.03;

				groep = new THREE.Group();
				groep.add(clone);
				groep.add(kop);
				    groep.position.x = + 40;
				//   scene.add(kop);
				scene.add(groep);

				//   scene.add(kop);
			},
				// called while loading is progressing
				function (xhr) {
					;
					// 	console.log((xhr.loaded / xhr.total * 100) + '% loaded');
				},
				// called when loading has errors
				function (error) {
					console.log('O, 0 An error happened during loading');
					if (location.hostname == "localhost")
						alert('O, 0 An error happened during loading');
				}
			);    // einde loader
		}   // einde laadModel  

		function laadModel() {
			let kop; 
			let pad = "https://cdn.jsdelivr.net/gh/robvancooten/glb/";
			let model = pad + 'bladerKop.glb';
			//  console.log("model: " + model)
			const loader = new GLTFLoader();

			loader.load(model, function (gltf) {
				kop = gltf.scene.children[0];

				// kop.scale.multiplyScalar(1);  // 50 
				kop.position.y = -5;    // - 95;
				kop.position.z = 21;    // - 95;
				kop.scale.x = kop.scale.y = kop.scale.z = 1.5;

				//	object.metalness = 10; // dir light werkt anders niet...?
				// object.texture.encoding = THREE.sRGBEncoding ; 

				scene.add(kop);
			},
				// called while loading is progressing
				function (xhr) {
					;
					// 	console.log((xhr.loaded / xhr.total * 100) + '% loaded');
				},
				// called when loading has errors
				function (error) {

					console.log('O, 0 An error happened during loading');
					if (location.hostname == "localhost")
						alert("'O, 0 An error happened during loading");

				}
			);    // einde loader
		}   // einde laadModel   		

	</script>

</body>

</html>
