		import { leesMenuTekst, isTouchDevice, kleurActiveLink } from './my_js/menu_tekst.js';

  			maakMenu();  

// basic setup
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// load an environment map (cube texture)
const loader = new THREE.CubeTextureLoader();
const envMap = loader.load([
  './images/skybox/woman1.jpg', './images/skybox/woman1.jpg',
  './images/skybox/woman1.jpg', './images/skybox/woman1.jpg',
  './images/skybox/woman1.jpg', './images/skybox/woman1.jpg'
]);

scene.background = envMap;
scene.environment = envMap; // important for PBR materials

// mirror material sphere
const geometry = new THREE.SphereGeometry(1, 64, 64);
const material = new THREE.MeshStandardMaterial({
  metalness: 1.0,   // full metal
  roughness: 0.0,   // perfectly smooth → mirror-like
  envMap: envMap
});

const sphere = new THREE.Mesh(geometry, material);
scene.add(sphere);

// a light (not strictly needed with envMap, but helps)
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 5, 5);
scene.add(light);

function animate() {
  requestAnimationFrame(animate);
  sphere.rotation.y += 0.01;
  renderer.render(scene, camera);
}
animate();
